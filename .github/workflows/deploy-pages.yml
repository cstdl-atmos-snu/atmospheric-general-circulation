# Deploys the course site (docs/) to GitHub Pages.
# Requires: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# Runs on every push to main that touches docs/, and on demand from the Actions tab ("Run workflow").
name: Deploy course site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-course-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out docs/ only (skips the large figures folder)
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs
          sparse-checkout-cone-mode: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
